spring.application.name=redshellissuetracker

# Local secrets (gitignored). optional: = no error if the file is missing
spring.config.import=optional:file:./local.properties

# Hosted DBs cap connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.url=jdbc:postgresql://red-shell-issue-tracker-neon-core-pooler.sage.cloud.layerbase.dev/red_shell_issue_tracker?sslmode=require&connectTimeout=30

# Flyway owns the schema, Hibernate only checks it
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.mjsamaha.redshellissuetracker.tenant.TenantIdentifierResolver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations are in src/main/resources/db/migration
spring.flyway.validate-migration-naming=true

# API docs are available only in the local development profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
